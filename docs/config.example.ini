; Vita JP Overlay settings. Changes apply the next time the overlay opens.

; Dictionary used for word lookups: hachidori | local | jpdb | jiten
dictionary = local

; Hachidori relay computer: host[:port], default port 19633 (no API key)
; Plain HTTP: use only on a trusted LAN. Anki and a sharing Hachidori host
; with dictionaries must be running; enable Sharing > Also with my other computers.
hachidori_host =

; Local Yomitan dictionaries: convert on a computer, then copy .vjdict files here.
local_dictionary_dir = ux0:data/VitaJPOverlay/dictionaries
; Up to 8 filenames, separated by commas, in priority order.
local_dictionaries = plaintext.vjdict
; Dictionaries shown per selected word, 1-8: the best match first, then each
; other dictionary's entry in the order above. Up/Down pages; one is in memory.
local_dictionary_results = 1

; jpdb.io API key (needed for dictionary = jpdb): jpdb.io -> Settings -> API key
jpdb_api_key =

; jiten.moe API key (needed for dictionary = jiten): jiten.moe -> Settings -> API key
jiten_api_key =

; Drop OCR lines without Japanese characters: none | lines
non_japanese_filter = lines

; Left/right character lookup skips Latin text, numbers and punctuation: on | off.
; Select Japanese kana and Han characters; this does not tokenize words.
japanese_only_selection = on

; Highlight the dictionary match or only the cursor character: word | character.
; Word skips the matched source span; character steps one character.
highlight_mode = word

; Text size, 8-40: Japanese (sentence, words, readings) and English (meanings, messages)
font_size_ja = 18
font_size_en = 14

; Opens/closes the overlay: a button combination, or a double tap on the rear
; touchpad (buttons are hidden from the game; rear taps are not):
; l+r | select | start | select+l | select+r | rear_double_tap
toggle_button = l+r

; Turns subtitles on/off: the recognized text in a strip at the top of the
; screen while the game runs, with furigana once its words are looked up
; (jpdb or jiten only). Same values as toggle_button, but not the same one.
; When one is part of the other (select and select+r), the shorter one acts
; on release.
subtitle_button = select+r

; Text is read from screenshots using OCR.
text_source = ocr

; OCR: lens (online) | vocr (on the Vita: vita-vn-ocr, needs a build with it
; and its model file; see docs/vita-vn-ocr.md) | ncnn (PP-OCRv5, host tests only)
; Local OCR never falls back to uploading the screen.
ocr_backend = vocr
ocr_model_dir = ux0:data/VitaJPOverlay/ocr
; vocr weights in ocr_model_dir: VOCR3_H15_w8.vocr (default) | VOCR3_FL10_w8.vocr
; (smaller) | v0.2.0's H15_w8.vocr, FL10_w8.vocr | F20_w8.vocr (larger)
vocr_model = VOCR3_H15_w8.vocr
; Smaller weights used automatically for a job when the game has too little free
; memory for vocr_model: VOCR3_FL10_w8.vocr | FL10_w8.vocr | none
vocr_fallback_model = VOCR3_FL10_w8.vocr
; vocr: read the region once its rows have held still this long, in ms (0-1000,
; 0 = off; sent in 10 ms steps), so text that types out is read whole; waiting at
; most ocr_settle_max_ms (100-10000, in 50 ms steps) per recognition, then it reads
; anyway (set it above ocr_settle_ms, or every wait runs out before the text holds still).
ocr_settle_ms = 150
ocr_settle_max_ms = 2000
; vocr: skip found lines with no ink (an even area, a smooth gradient): on | off
; (off: it finds next to none at native resolution; see docs/vita-vn-ocr.md)
ocr_skip_blank_lines = off
; vocr: lines recognized at once (1-3), and 444 MHz while recognizing (on | off)
ocr_threads = 3
ocr_boost_clock = off

; auto: recognize text in the background when the region changes (lens, vocr)
; on_press: recognize only when the overlay is opened
ocr_mode = auto

; Debugging: IP of a computer running tools/udp_log_listener.py (empty = off)
log_host =

; Debugging: write ux0:data/VitaJPOverlay/log.txt (max 1 MB + one rotated file): on | off
log_file = on

; ---- Anki card mining (optional, see docs/anki.md) ----
; on: × in the overlay saves the shown word as a card in a queue on the memory
; card (ux0:data/VitaJPOverlay/anki_queue), even with Wi-Fi off or Anki closed.
; △ sends the queue to AnkiConnect on a computer on your local network (plain
; HTTP). No AnkiWeb sync. off (the default): × and △ do nothing.
anki_mining = off

; The computer running Anki with AnkiConnect, for △: its IP address[:port]
; (default 8765), or auto = search the local network once. Empty: cards stay queued.
anki_host =

; Deck (created if missing), note type, and tags separated by spaces. These and
; the fields below are read when △ sends, so queued cards use the latest ones.
anki_deck = Default
anki_note_type = Lapis
anki_tags = vita-jp-overlay

; The note type's field for each item; empty = leave it out
anki_field_word = Expression
anki_field_reading = ExpressionReading
anki_field_furigana = ExpressionFurigana
anki_field_definition = MainDefinition
anki_field_sentence = Sentence
anki_field_picture = Picture
anki_field_frequency = FreqSort
anki_field_audio = ExpressionAudio
anki_field_sentence_furigana = SentenceFurigana
anki_field_pitch_position = PitchPosition
anki_field_pitch_categories = PitchCategories
anki_field_frequency_list = Frequency
anki_field_misc_info = MiscInfo

; Word audio, looked up when △ sends: a Yomitan audio source URL with {term}
; and {reading} (empty = off)
anki_audio_url =
